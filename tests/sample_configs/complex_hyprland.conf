# Complex Hyprland config with custom sources and directives
source = ~/.config/hypr/colors.conf

# Multi-monitor setup with VRR and rotation
monitor = DP-1, 2560x1440@165, 0x0, 1.25, vrr, 1
monitor = DP-2, 1920x1080@60, 2560x0, 1, transform, 1
monitor = HDMI-A-1, disable

$mod = SUPER_SHIFT

# Startup items
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# exec-once = mpvpaper -o "no-audio --loop" DP-1 /video.mp4  # disabled startup

input {
    kb_layout = us,ru,de
    kb_options = grp:win_space_toggle,caps:swapescape
    repeat_rate = 60
    repeat_delay = 250
    sensitivity = -0.2
    accel_profile = flat
    natural_scroll = true
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 3
    col.active_border = rgba(ca9ee6ee) rgba(8caaeeee) 45deg
    col.inactive_border = rgba(414559aa)
    layout = master
}

decoration {
    rounding = 12
    active_opacity = 0.95
    inactive_opacity = 0.80
    drop_shadow = false
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
}

# Custom workspace rules
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 9, monitor:DP-2, persistent:true

# Complex window rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = workspace 9, class:^(Spotify)$
windowrulev2 = size 1000 700, class:^(org.gnome.Nautilus)$

# Keybinds
bind = $mod, Return, exec, kitty
bind = SUPER, Space, exec, rofi -show drun
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
