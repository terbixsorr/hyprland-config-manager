<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Hyprland Cyan-Blue Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Gear Accent Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Canvas -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Neon Border Glow -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Tiling Windows Representation (Hyprland Dwindle Layout) -->
  <!-- Main Window (Left) -->
  <rect x="22" y="24" width="46" height="80" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="url(#neonGrad)" stroke-width="2" filter="url(#neonGlow)" />
  
  <!-- Sub Window 1 (Top Right) -->
  <rect x="74" y="24" width="32" height="37" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1.5" />
  
  <!-- Sub Window 2 (Bottom Right) -->
  <rect x="74" y="67" width="32" height="37" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1.5" />

  <!-- Minimalist Settings Gear in Bottom Right Center -->
  <g transform="translate(85, 80) scale(0.65)" stroke="url(#neonGrad)" stroke-width="3" fill="none">
    <circle cx="8" cy="8" r="6" stroke-width="2.5" fill="#0f172a" />
    <path d="M8,0 L8,3 M8,13 L8,16 M0,8 L3,8 M13,8 L16,8 M2.3,2.3 L4.5,4.5 M11.5,11.5 L13.7,13.7 M2.3,13.7 L4.5,11.5 M11.5,4.5 L13.7,2.3" stroke-linecap="round" />
  </g>

  <!-- Left Window Accent Line / Terminal Prompt Indicator -->
  <circle cx="30" cy="34" r="2.5" fill="#00f0ff" />
  <circle cx="38" cy="34" r="2.5" fill="#38bdf8" />
  <line x1="30" y1="46" x2="56" y2="46" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="54" x2="48" y2="54" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
</svg>
